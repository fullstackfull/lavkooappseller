name: syriacosmeticsmanger
description: A new Flutter application.
publish_to: 'none'
# Must stay at or above the minimum the backend publishes in
# seller_app_version_control (Admin -> Business Settings -> App Settings),
# or the splash force-update gate locks every seller out before the login
# screen. See test/app_version_gate_test.dart and MIGRATION.md.
version: 3.1.6+49

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.0
  provider: ^6.1.5+1
  connectivity_plus: ^7.0.0
  dio: ^5.9.1
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  flutter_switch: ^0.3.2
  cached_network_image: ^3.4.1
  flutter_typeahead: ^5.2.0
  autocomplete_textfield: ^2.0.1
  dotted_border: ^3.1.0
  flutter_html: ^3.0.0
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^20.1.0
  path_provider: ^2.1.5
  country_code_picker: ^3.4.1
  pin_code_fields: ^8.0.1
  permission_handler: ^12.0.1
  barcode_widget: ^2.0.4
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  flutter_spinkit: ^5.2.2
  percent_indicator: ^4.2.5
  flutter_speed_dial: ^7.0.0
  barcode_scan2: ^4.7.2
  print_bluetooth_thermal: ^1.1.7
  screenshot: ^3.0.0
  esc_pos_utils_plus: ^2.0.4
  flutter_slidable: ^4.0.3
  readmore: ^3.0.0
  flutter_html_table: ^3.0.0
  syncfusion_flutter_datepicker: ^32.2.4
  textfield_tags: 2.0.2
  http: ^1.6.0
  path: ^1.9.1
  emoji_picker_flutter: ^4.4.0
  syncfusion_flutter_charts: ^32.2.4
  carousel_slider: ^5.1.2
  flutter_downloader: ^1.12.0
  open_file: ^3.5.11
  open_file_manager: ^2.0.1
  just_the_tooltip: ^0.0.12
  syncfusion_flutter_pdfviewer: ^32.2.4
  audioplayers: ^6.5.1
  flutter_xlider: ^3.5.0
  video_player: ^2.10.1
  chewie: ^1.13.0
  get_thumbnail_video: ^0.7.3
  flutter_svg: ^2.2.3
  collection: any
  fluttertoast: ^9.0.0
  flutter_image_compress: ^2.4.0
  firebase_auth: ^6.1.4
  firebase_crashlytics: ^5.0.5
  package_info_plus: ^9.0.0
  share_plus: ^12.0.0
  flutter_secure_storage: ^10.0.0
  flutter_animate: ^4.5.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  image: ^4.5.4
  html: ^0.15.6
dependency_overrides:
  syncfusion_flutter_core: ^32.2.4

dev_dependencies:
  icons_launcher:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.5.0


icons_launcher:
  image_path: "assets/images/icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
    macos:
      enable: true

flutter_icons:
  ios: true
  android: true
  image_path: "assets/images/icon.png"



flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/language/
    - assets/svg/

  fonts:
    # Cairo covers Arabic and Latin in one family, so mixed strings (prices,
    # order ids) keep a single weight and baseline. Roboto stays for the few
    # places that ask for it explicitly.
    - family: Cairo
      fonts:
        - asset: assets/font/cairo/Cairo-Regular.ttf
          weight: 400
        - asset: assets/font/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/font/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/font/cairo/Cairo-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/font/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/roboto/Roboto-Bold.ttf
          weight: 700