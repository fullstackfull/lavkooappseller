org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Jetifier rewrites `android.support.*` references to `androidx.*`, so it has
# work to do only in an archive that holds class files. The Flutter engine's
# per-ABI artifacts hold none: each is a single `lib/<abi>/libflutter.so` (plus
# a Vulkan validation layer on arm64) and not one `.class` entry. Jetifier
# still reads whatever it is handed fully into the heap, so a debug APK was
# giving it 1.29 GiB of native code to inflate, scan for class files it cannot
# contain, and write back out again:
#
#   armeabi_v7a_debug   1 entry    332.7 MiB inflated   (109.4 MiB stored)
#   arm64_v8a_debug     2 entries  614.1 MiB inflated   (172.2 MiB stored)
#   x86_64_debug        1 entry    371.9 MiB inflated   (114.3 MiB stored)
#
# Those inflate into single byte arrays of 237-377 MiB apiece, which G1 has to
# place as humongous objects, and each needs a second copy on the way out.
# Gradle runs artifact transforms concurrently, so together with Gradle's and
# AGP's own working set this went past -Xmx4G and failed
# `:app:compileDebugKotlin` with "Java heap space" while it was resolving
# debugCompileClasspath (CI run 70).
#
# Skipping these three artifacts removes the allocation instead of making room
# for it, which is why the heap figure on the first line is left alone: raising
# it would only buy space for copying native code to no purpose, and would do
# it on a runner that has already set aside 1 GiB of metaspace. Every archive
# that does hold class files is still jetified exactly as before, including
# flutter_embedding_debug (451 entries, 1.4 MiB) -- the engine artifact that
# actually carries the Java embedding. The patterns are left unanchored and are
# matched against the artifact's file name, as `bcprov-jdk15on` is in AGP's own
# documented example of this property.
android.jetifier.ignorelist=armeabi_v7a_(debug|profile|release)-,arm64_v8a_(debug|profile|release)-,x86_64_(debug|profile|release)-

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
