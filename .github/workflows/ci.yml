name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately: `channel: stable` moves on its own and raises
          # its minimum AGP/Kotlin requirements when it does. Bump this and the
          # versions in android/settings.gradle.kts together, and run
          # `flutter build apk --debug` locally before pushing the bump.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting of changed Dart files
        run: dart format --output=none --set-exit-if-changed lib/helper lib/theme lib/common/basewidgets/glass tool
        continue-on-error: true

      # `flutter analyze` treats warnings as fatal (infos are opted out below).
      # Run this exact command locally: `dart analyze` does NOT fail on
      # warnings, so it will pass while this step fails.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Check translation keys
        run: dart run tool/check_translations.dart

      # The market selector is shown only in a build made with this flag, so the full run below tests the build without it: the tests
      # that name the flag follow it there, and show the selector absent. This step runs the same folder with the flag on, which is the
      # build the selector is made for, so that what a build with storefronts does is read on its own, and even when the full run is red.
      - name: Test the market selector, the market header and the reload of the screens with the storefront flag on (K-03)
        if: always()
        run: flutter test --dart-define=GCC_STOREFRONTS_ENABLED=true test/market_selector

      - name: Test
        run: flutter test

      # The work in flight is read by name after the full run, and even when the full run is red (test/app_version_gate_test.dart is on main).
      - name: Test the POS rules (who a sale is for, what a 200 answer means, the key of a sale, what the camera reads, what becomes of a sale that could not be sent, what the cart keeps after a refusal; K-05, K-06, K-18)
        if: always()
        run: flutter test test/pos_customer_id_test.dart test/pos_order_answer_test.dart test/pos_idempotency_key_test.dart test/product_barcode_formats_test.dart test/outbox_policy_test.dart test/offline_outbox_behaviour_test.dart test/pos_sale_outcome_test.dart

      # A queued sale is replayed in the market it was taken in, not in the market the seller works in when it is sent. The entry names the market, and the replay sends it, only in a build with storefronts on:
      # the full run above is the build without the flag, so this step reads the file by name, and the next step runs it with the flag on.
      - name: Test that a queued sale keeps the market it was taken in, and is replayed there whatever market is chosen afterwards (K-03, K-06)
        if: always()
        run: flutter test test/market_selector/queued_sale_market_test.dart

      - name: Test that a queued sale keeps the market it was taken in, with the storefront flag on (K-03, K-06)
        if: always()
        run: flutter test --dart-define=GCC_STOREFRONTS_ENABLED=true test/market_selector/queued_sale_market_test.dart

      - name: Test that a queued sale is sent only by the session of the seller who took it, also when it names no seller (K-06)
        if: always()
        run: flutter test test/offline_outbox_owner_test.dart

      # One phone on the counter, more than one seller: a sign-out takes the market, the cart and the currency of the seller who signed out, and leaves the sales that could not be sent for them. The file
      # asks for the market with storefronts on itself, so it says the same thing in either build; the step is run with the flag as well, because that is the build the market a sale is owed to is written in.
      - name: Test that a second login on the same device inherits no market, cart or currency of the first, while the unsent sales stay queued for the seller who took them (K-12)
        if: always()
        run: flutter test test/second_login_on_one_device_test.dart

      - name: Test that a second login on the same device starts clean, with the storefront flag on (K-12)
        if: always()
        run: flutter test --dart-define=GCC_STOREFRONTS_ENABLED=true test/second_login_on_one_device_test.dart

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    env:
      # A long-lived daemon buys nothing on a single-use runner, and its
      # lifecycle is what produces "cannot lock execution history cache"
      # failures when it restarts mid-configuration.
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      # This app builds to a ~120 MB debug APK, and the Gradle, Kotlin and
      # Flutter engine caches on top of it exhaust the runner's ~14 GB of free
      # space. Reclaim the preinstalled toolchains this build never touches.
      # The Android SDK under /usr/local/lib/android is deliberately kept.
      - name: Free disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules \
                      /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "After:"; df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately: `channel: stable` moves on its own and raises
          # its minimum AGP/Kotlin requirements when it does. Bump this and the
          # versions in android/settings.gradle.kts together, and run
          # `flutter build apk --debug` locally before pushing the bump.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug build only: the release keystore is deliberately not in the repo.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report disk usage
        if: always()
        run: df -h / | tail -1
