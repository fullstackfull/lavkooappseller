name: CI

on:
  push:
    # `gcc/**` is the branch the GCC plan is developed on, in all three repositories, so its pushes are verified like any other.
    branches: [main, 'claude/**', 'gcc/**']
  # Every pull request, whatever its base: a pull request stacked on another has its own run, which a filter on the base `main` never gave it.
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The formatting check below reads the Dart files THIS change touches, so it needs the commit the change starts from.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately: `channel: stable` moves on its own and raises
          # its minimum AGP/Kotlin requirements when it does. Bump this and the
          # versions in android/settings.gradle.kts together, and run
          # `flutter build apk --debug` locally before pushing the bump.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # It used to read four fixed paths with `continue-on-error: true`, which is a check that REFUSES NOTHING: unformatted Dart in
      # lib/helper turned the step orange and the job green, and anything outside those four paths was not read at all. It now reads the
      # Dart files this change itself adds or edits, and it fails the job. Scoped to the change on purpose -- the rest of the app has
      # never been formatted in CI, so reading all of it would make every pull request red for drift nobody here introduced.
      - name: Which change to read
        id: range
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "The event names no base this clone has (a new branch, or a manual run), so the change is read against origin/main."
            git fetch --no-tags --quiet origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          echo "Reading the change from ${base} to $(git rev-parse HEAD)."
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Verify formatting of changed Dart files
        run: |
          changed="$(git diff --name-only --diff-filter=ACMR "${{ steps.range.outputs.base }}" HEAD -- '*.dart')"
          if [ -z "$changed" ]; then
            echo "This change touches no Dart file."
            exit 0
          fi
          echo "$changed"
          # shellcheck disable=SC2086
          dart format --output=none --set-exit-if-changed $(echo $changed)

      # `flutter analyze` treats warnings as fatal (infos are opted out below).
      # Run this exact command locally: `dart analyze` does NOT fail on
      # warnings, so it will pass while this step fails.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Check translation keys
        run: dart run tool/check_translations.dart

      # Read first, because it is what keeps the rest of this job in the shape the
      # criterion asks for: every named feature step ahead of the whole run, the
      # whole run last, and nothing in the job skippable by a red step above it.
      - name: Test that every named feature step runs before the whole run, and that none of them can hide it (K-15)
        if: always()
        run: flutter test test/ci_step_order_test.dart

      # Each feature's tests run by name before the full run: the whole run below is red on main for one known test (test/app_version_gate_test.dart), and a step after a failed
      # step does not run unless it says `if: always()`, so a named step is the only way the result of one feature can be read on its own.
      - name: Test the market scope, the market choice, the sign-in header and the version helper (K-01, K-02, K-10, K-12, K-14)
        if: always()
        run: flutter test test/dio_storefront_header_test.dart test/market_scope_test.dart test/seller_market_choice_test.dart test/dio_auth_header_test.dart test/version_helper_test.dart

      # The platform's own switch for the force-update gate, read by name: it is the lever that gets a platform out of a minimum
      # typed one digit too high, so what it does has to be readable on its own and not only inside the whole run.
      - name: Test the switch the platform publishes for the version gate (K-V5)
        if: always()
        run: flutter test test/seller_version_gate_switch_test.dart

      # Where a digital file is fetched from and what the fetch carries. Half of this file is about where the seller's
      # credential must NOT go, so it is read by name rather than only inside the whole run.
      - name: Test the address of a digital file and what its fetch carries (K-17)
        if: always()
        run: flutter test test/digital_file_address_test.dart

      - name: Test the point-of-sale scan of country-scoped codes (K-05, K-13)
        if: always()
        run: flutter test test/pos_scan

      - name: Test the order edit refusal and the approved review average (K-07)
        if: always()
        run: flutter test test/order_edit_submit_contract_test.dart test/order_edit_submit_flow_test.dart test/product_review_average_test.dart

      # The platform admin shell is compiled in only when this flag is set, so the
      # full run below skips the tests that need it on. This step is their proof
      # that a build with the flag on registers and shows what it should. It comes
      # first so that a failure elsewhere in the full run cannot hide it.
      - name: Test the platform admin shell with its flag on
        if: always()
        run: flutter test --dart-define=GCC_PLATFORM_ADMIN_ENABLED=true test/platform_admin

      - name: Test that the seller app makes no theme call (F-03, K-18)
        if: always()
        run: flutter test test/no_theme_call_test.dart

      - name: Test the push route and the rating rule (K-07, K-11)
        if: always()
        run: flutter test test/notification_route_test.dart test/approved_rating_screens_test.dart test/product_card_rating_test.dart

      - name: Test the market of a push and the topics of a market (K-11, K-V4)
        if: always()
        run: flutter test test/notification_market_test.dart test/seller_push_topics_test.dart

      - name: Test the paused market the seller is told about (K-V4)
        if: always()
        run: flutter test test/storefront_pause_test.dart

      # What the signed-in role may use, and the entries of the "more" screen a role cannot. The rule is read with the flag both
      # ways by the tests themselves, so the step below is what the build the hiding is made for does on its own.
      - name: Test what a role may use and the entries a role is not shown (K-08)
        if: always()
        run: flutter test test/seller_permission_scope_test.dart test/more_screen_permissions_test.dart

      - name: Test what a role may use with the role screens on (K-08)
        if: always()
        run: flutter test --dart-define=GCC_ROLE_SCREENS_ENABLED=true test/seller_permission_scope_test.dart test/more_screen_permissions_test.dart

      - name: Test the lavkooseller:// link (K-11)
        if: always()
        run: flutter test test/seller_deep_link_test.dart test/seller_deep_link_entry_test.dart test/notification_screens_test.dart

      - name: Test the market selector and the reload of the screens (K-03)
        if: always()
        run: flutter test test/market_selector

      # The market selector is shown only in a build made with this flag, so the full run below tests the build without it: the tests
      # that name the flag follow it there, and show the selector absent. This step runs the same folder with the flag on, which is the
      # build the selector is made for, so that what a build with storefronts does is read on its own, and even when the full run is red.
      - name: Test the market selector, the market header and the reload of the screens with the storefront flag on (K-03)
        if: always()
        run: flutter test --dart-define=GCC_STOREFRONTS_ENABLED=true test/market_selector

      # The market's own money is written only in a build made with the flag and a stored market; the full run tests the build without the flag, in which these tests
      # follow the flag. This step runs the same folder with the flag on, so that what a build with storefronts writes is read on its own.
      - name: Test the market's own money, its decimals, the amounts typed and the balance that is refused rather than zeroed (K-04.2, K-10)
        if: always()
        run: flutter test test/market_money test/market_scope_test.dart

      - name: Test the market's own money with the storefront flag on (K-04.2, K-10)
        if: always()
        run: flutter test --dart-define=GCC_STOREFRONTS_ENABLED=true test/market_money test/market_scope_test.dart

      # A named step, so that the result of this test can be read on its own: the whole run below is red on main for one known test (the version gate).
      - name: Test that a burst of 401s signs the seller out once (K-12)
        if: always()
        run: flutter test test/api_checker_unauthorized_test.dart

      # K-12: the seller's session token lives in the Keystore / Keychain and not in the plain preferences file. The behaviour test has existed
      # since the token was moved and had NO step of its own, so the one run that read it was the whole run below, which is red on main for the
      # version gate — a security property that cannot be read green on its own is not being reported. The source rules run beside it: the
      # behaviour test says today's code keeps the token out of plaintext, and the scan says the code has no way back to it.
      - name: Test that the session token is kept in the platform secure store and nothing else may name the legacy key (K-12)
        if: always()
        run: flutter test test/seller_session_token_test.dart test/seller_session_token_source_rules_test.dart

      # Four files of this branch had no step of their own, and were read only in the whole run below, which is red for the
      # version gate. Each step is named for what its file proves and no more: the refusal of a total that would add two
      # currencies is proved for the report, and not for the statement, whose own refusal has no test on this branch.
      - name: Test the image rules the two seller forms read from the table (K-17)
        if: always()
        run: flutter test test/shop_images

      - name: Test the statement's two scopes, the trace from a line to the payout that took it out and the order that earned it, and that a total which would add two currencies is refused rather than read as a zero balance (K-09, K-10)
        if: always()
        run: flutter test test/statement_contract_test.dart

      - name: Test the report, and that a total which would add two currencies is refused rather than added (K-09, K-10)
        if: always()
        run: flutter test test/report_contract_test.dart

      # Whose sale a queued sale is, and which market it is owed to, are read by their own steps below; this file is the entry itself.
      - name: Test that the entry a sale that could not be sent is written as survives the disk, and a corrupt entry does not throw (K-06)
        if: always()
        run: flutter test test/pending_pos_order_test.dart

      # The work in flight is read by name before the full run, and even when the full run is red (test/app_version_gate_test.dart is on main).
      - name: Test the POS rules (who a sale is for, what a 200 answer means, the key of a sale, what the camera reads, what becomes of a sale that could not be sent, what the cart keeps after a refusal, whose sale a queued sale is; K-05, K-06, K-18)
        if: always()
        run: flutter test test/pos_customer_id_test.dart test/pos_order_answer_test.dart test/pos_idempotency_key_test.dart test/product_barcode_formats_test.dart test/outbox_policy_test.dart test/offline_outbox_behaviour_test.dart test/pos_sale_outcome_test.dart test/offline_outbox_owner_test.dart

      # A queued sale is replayed in the market it was taken in, not in the market the seller works in when it is sent. The entry names the market, and the replay sends it, only in a build with storefronts on:
      # the full run below is the build without the flag, so this step reads the file by name, and the next step runs it with the flag on.
      - name: Test that a queued sale keeps the market it was taken in, and is replayed there whatever market is chosen afterwards (K-03, K-06)
        if: always()
        run: flutter test test/market_selector/queued_sale_market_test.dart

      - name: Test that a queued sale keeps the market it was taken in, with the storefront flag on (K-03, K-06)
        if: always()
        run: flutter test --dart-define=GCC_STOREFRONTS_ENABLED=true test/market_selector/queued_sale_market_test.dart

      - name: Test that a queued sale is sent only by the session of the seller who took it, also when it names no seller (K-06)
        if: always()
        run: flutter test test/offline_outbox_owner_test.dart

      # One phone on the counter, more than one seller: a sign-out takes the market, the cart and the currency of the seller who signed out, and leaves the sales that could not be sent for them. The file
      # asks for the market with storefronts on itself, so it says the same thing in either build; the step is run with the flag as well, because that is the build the market a sale is owed to is written in.
      - name: Test that a second login on the same device inherits no market, cart or currency of the first, while the unsent sales stay queued for the seller who took them (K-12)
        if: always()
        run: flutter test test/second_login_on_one_device_test.dart

      - name: Test that a second login on the same device starts clean, with the storefront flag on (K-12)
        if: always()
        run: flutter test --dart-define=GCC_STOREFRONTS_ENABLED=true test/second_login_on_one_device_test.dart

      # The seller flows are read by name before the full run, and even when the full run is red (test/app_version_gate_test.dart is
      # red on main by an owner decision): a step after a failed step does not run unless it says so, so a named step is the only
      # way what one flow proves can be read on its own. `!cancelled()` rather than `always()`, which would go on running these
      # six after someone pressed cancel. Neither carries continue-on-error, so a flow that fails still fails the job.
      - name: Test the order list, the order screen and the change of an order's status, in the request and in the handling of the answer (K-16.4)
        if: ${{ !cancelled() }}
        run: flutter test test/flows/orders_flow_test.dart

      - name: Test the product list, the delete and the status switch, in the request and in the handling of the answer (K-16.4)
        if: ${{ !cancelled() }}
        run: flutter test test/flows/products_flow_test.dart

      - name: Test the adding and the updating of a product, in the request and in the handling of the answer (K-16.4)
        if: ${{ !cancelled() }}
        run: flutter test test/flows/product_save_flow_test.dart

      - name: Test the stock-out list, the quantity updates, the restock requests and the stock ledger, in the request and in the handling of the answer (K-16.4)
        if: ${{ !cancelled() }}
        run: flutter test test/flows/stock_flow_test.dart

      - name: Test the withdrawal request, the list of withdrawals and the ledger's payouts, in the request and in the handling of the answer (K-16.4)
        if: ${{ !cancelled() }}
        run: flutter test test/flows/withdrawals_flow_test.dart

      - name: Test the review list, the filter, the status switch and the reply, in the request and in the handling of the answer (K-16.4)
        if: ${{ !cancelled() }}
        run: flutter test test/flows/reviews_flow_test.dart

      # The contract files that had no step of their own. Which of them count as
      # GCC work is a judgement — control tower and security are GCC-20 surface,
      # the rest carry the seller features the GCC work reads — so they are all
      # named here rather than sorted, and every test file on the branch except
      # the reserved version gate now reports under a name of its own.
      - name: Test the remaining seller contracts the GCC work reads (action centre, automation, brand claim, bulk job, control tower, finance control, inventory, order breakdown, shipment holds, pricing policy, report export, returns, security, seller centre)
        if: always()
        run: |
          flutter test test/action_center_contract_test.dart test/automation_contract_test.dart \
            test/brand_claim_contract_test.dart test/bulk_job_contract_test.dart \
            test/control_tower_contract_test.dart test/finance_control_contract_test.dart \
            test/inventory_contract_test.dart test/order_breakdown_contract_test.dart \
            test/shipment_hold_contract_test.dart \
            test/pricing_policy_contract_test.dart test/report_export_helper_test.dart \
            test/return_contract_test.dart test/security_contract_test.dart \
            test/seller_center_contract_test.dart

      # The whole run is last, so that every named step above reports before it,
      # and it carries `always()` for the same reason those steps do: without a
      # guard its default is `success()`, so one red named step would skip it and
      # the suite's own figures — the only evidence of how many tests fail and
      # which — would be missing from the run. A failure here still fails the job.
      - name: Test
        if: always()
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    env:
      # A long-lived daemon buys nothing on a single-use runner, and its
      # lifecycle is what produces "cannot lock execution history cache"
      # failures when it restarts mid-configuration.
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      # This app builds to a ~120 MB debug APK, and the Gradle, Kotlin and
      # Flutter engine caches on top of it exhaust the runner's ~14 GB of free
      # space. Reclaim the preinstalled toolchains this build never touches.
      # The Android SDK under /usr/local/lib/android is deliberately kept.
      - name: Free disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules \
                      /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "After:"; df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately: `channel: stable` moves on its own and raises
          # its minimum AGP/Kotlin requirements when it does. Bump this and the
          # versions in android/settings.gradle.kts together, and run
          # `flutter build apk --debug` locally before pushing the bump.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug build only: the release keystore is deliberately not in the repo.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report disk usage
        if: always()
        run: df -h / | tail -1

  # M-456. The backend repository refuses a pull request that adds a secret or personal data; this one did not refuse anything of the kind,
  # on any ref -- searching every version of this workflow for a scanner returned nothing. A seller app holds exactly the material that
  # matters: the signing keystore's passwords, the push credentials, a tester's telephone number typed into a fixture and left there.
  #
  # Its own job, not a step of `analyze-and-test`, for two reasons: that job's last step must stay the whole test run (K-15, pinned by
  # test/ci_step_order_test.dart), and a scan that needs the whole history must not make the test job fetch it.
  leak-guard:
    name: No secret or personal data added
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scanner reads the change commit by commit as well as whole, because a secret added and taken out again
          # in the same branch is still in the pushed history. A shallow clone cannot answer that.
          fetch-depth: 0

      - name: Which change to read
        id: range
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "The event names no base this clone has (a new branch, or a manual run), so the change is read against origin/main."
            git fetch --no-tags --quiet origin main
            base="$(git rev-parse FETCH_HEAD)"
          fi
          echo "Reading the change from ${base} to $(git rev-parse HEAD)."
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      # PHP because the scanner is the backend's reviewed and tested one, ported rather than rewritten; the runner has it already,
      # so this adds no toolchain. It prints where it found something and which rule, never the text it matched.
      - name: Scan what this change adds
        run: php .github/scripts/leak-guard.php --base="${{ steps.range.outputs.base }}"
