name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately: `channel: stable` moves on its own and raises
          # its minimum AGP/Kotlin requirements when it does. Bump this and the
          # versions in android/settings.gradle.kts together, and run
          # `flutter build apk --debug` locally before pushing the bump.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting of changed Dart files
        run: dart format --output=none --set-exit-if-changed lib/helper lib/theme lib/common/basewidgets/glass tool
        continue-on-error: true

      # `flutter analyze` treats warnings as fatal (infos are opted out below).
      # Run this exact command locally: `dart analyze` does NOT fail on
      # warnings, so it will pass while this step fails.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Check translation keys
        run: dart run tool/check_translations.dart

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    env:
      # A long-lived daemon buys nothing on a single-use runner, and its
      # lifecycle is what produces "cannot lock execution history cache"
      # failures when it restarts mid-configuration.
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      # This app builds to a ~120 MB debug APK, and the Gradle, Kotlin and
      # Flutter engine caches on top of it exhaust the runner's ~14 GB of free
      # space. Reclaim the preinstalled toolchains this build never touches.
      # The Android SDK under /usr/local/lib/android is deliberately kept.
      - name: Free disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules \
                      /opt/ghc /usr/local/.ghcup /usr/share/swift \
                      /usr/local/share/powershell /usr/local/share/chromium \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          echo "After:"; df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately: `channel: stable` moves on its own and raises
          # its minimum AGP/Kotlin requirements when it does. Bump this and the
          # versions in android/settings.gradle.kts together, and run
          # `flutter build apk --debug` locally before pushing the bump.
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug build only: the release keystore is deliberately not in the repo.
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Report disk usage
        if: always()
        run: df -h / | tail -1
